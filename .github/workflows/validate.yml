# Checks run on every proposed change.
#
# IMPORTANT AND NOT OBVIOUS: on the `pull_request` trigger, GitHub runs the
# workflow file as it appears in the proposal. So a proposal can edit this file
# and make its own checks pass. We reduce that two ways:
#
#   1. The validator itself is taken from the ALREADY-ACCEPTED branch, not from
#      the proposal. A proposal can therefore change what is checked only by
#      editing this file, which is administrator-owned (see .github/CODEOWNERS)
#      and cannot be merged without two administrators.
#   2. validate-main.yml re-runs everything after merging. That run cannot be
#      influenced by any proposal and is the authoritative one.
#
# Treat a green check here as useful, not as proof. See polymath_design_v3.md, s3.
name: validate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposal's content
        uses: actions/checkout@v4
        with:
          path: proposal
          fetch-depth: 0

      - name: Check out the validator from the accepted branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse a proposal that edits the checks themselves
        run: |
          cd proposal
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
               | grep -E '^(\.github/|polymath$|people/)' ; then
            echo "::warning::This proposal changes the checks, the client, or the member"
            echo "::warning::list. Two administrators must review it, and no result from"
            echo "::warning::this run should be trusted."
          fi

      # The authoritative check: the ALREADY-ACCEPTED validator, run against the
      # proposal's content. A proposal cannot change what this does without
      # editing .github/, which is administrator-owned.
      - name: Validate the proposal using the accepted validator
        run: python3 trusted/polymath --root proposal validate

      # The proposal's own tests, so that a change to the client is actually
      # tested. Note this runs code the proposal supplies. That is acceptable
      # here and only here: the runner is ephemeral, has no credentials, and is
      # destroyed afterwards. It is NOT what gates the integrity of the corpus --
      # the step above is, and that one the proposal cannot influence.
      - name: Run the proposal's own tests
        run: python3 proposal/tests/test_polymath.py

      # Deliberately NOT run here: the accepted branch's own test suite. That
      # tests the accepted branch, not the proposal, and belongs in
      # validate-main.yml, which already does it. Running it here once deadlocked
      # the repository: a failing test on main blocked every pull request,
      # including the one fixing that test.
